version: "3.8"

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    image: ra-nextjs-app:v8
    container_name: nextjs-app
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - ra-web_default

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./empty-dir:/usr/share/nginx/html
    depends_on:
      - nextjs
    networks:
      - ra-web_default

networks:
  ra-web_default:
    external: true
